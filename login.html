<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Portal Anak Papih</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body class="login-page-bg">
    <nav class="navbar">
        <div class="logo">Anak Papih</div>
        <ul class="nav-links">
            <li><button id="theme-toggle" class="theme-toggle" title="Toggle Theme">🌙</button></li>
        </ul>
    </nav>

    <main class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-badge">🔒 Akses Terproteksi</div>
                <h1>Selamat Datang</h1>
                <p>Silakan masuk terlebih dahulu untuk mengakses Beranda Sekolah & Arena Puzzle Game Anak Papih.</p>
            </div>

            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="login-username">Nama Pengguna / Username</label>
                    <div class="input-wrapper">
                        <span class="input-icon">👤</span>
                        <input type="text" id="login-username" placeholder="Masukkan username Anda..." required autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label for="login-password">Kata Sandi / Password</label>
                    <div class="input-wrapper" style="position: relative;">
                        <span class="input-icon">🔑</span>
                        <input type="password" id="login-password" placeholder="Masukkan password Anda..." required autocomplete="current-password" style="padding-right: 40px;">
                        <button type="button" id="toggle-password" class="toggle-password-btn" title="Tampilkan/Sembunyikan Password">👁️</button>
                    </div>
                </div>

                <div id="login-error" class="login-error-msg" style="display: none;"></div>

                <button type="submit" class="login-submit-btn">
                    <span>Masuk ke Dashboard</span>
                    <span class="btn-arrow">&rarr;</span>
                </button>
            </form>

            <div class="demo-credentials-box">
                <p class="demo-title">💡 Akun Demo Masuk:</p>
                <div class="demo-info">
                    <span>Username: <strong>siswa</strong></span>
                    <span>Password: <strong>anakpapih2026</strong></span>
                </div>
            </div>
        </div>
    </main>

    <footer class="blog-footer">
        <p>Hak Cipta &copy; 2026 Anak Papih SMP Merdeka.</p>
    </footer>

    <div id="toast" class="toast"></div>
    <script src="assets/js/script.js"></script>
</body>
</html>
