<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anak Papih Competition 2026</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .landing-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            position: relative;
            overflow: hidden;
            /* Animated gradient mesh background */
            background: linear-gradient(-45deg, #fce7f3, #e0e7ff, #fef3c7, #fee2e2);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        body.dark-mode .landing-page {
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #312e81, #1e1b4b);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        .landing-content {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            padding: 4rem 3rem;
            border-radius: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
            max-width: 800px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.5);
            z-index: 10;
            transform: translateY(20px);
            opacity: 0;
            animation: fadeInUp 1s ease forwards 0.2s;
        }

        body.dark-mode .landing-content {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .landing-title {
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary) 0%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
            letter-spacing: -1.5px;
        }

        .landing-subtitle {
            font-size: 1.25rem;
            color: var(--text-muted);
            margin-bottom: 3rem;
            line-height: 1.6;
        }

        .countdown-container {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 3.5rem;
        }

        .countdown-box {
            background: white;
            padding: 1.5rem;
            border-radius: 20px;
            min-width: 100px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(0,0,0,0.03);
        }

        body.dark-mode .countdown-box {
            background: var(--dark-card);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .countdown-number {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--dark);
        }

        body.dark-mode .countdown-number {
            color: #f8fafc;
        }

        .countdown-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
        }

        .cta-btn {
            display: inline-block;
            background: linear-gradient(135deg, var(--primary) 0%, #dc2626 100%);
            color: white;
            padding: 1.25rem 3rem;
            border-radius: 100px;
            font-size: 1.1rem;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 10px 25px -5px rgba(239, 68, 68, 0.4);
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .cta-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 35px -5px rgba(239, 68, 68, 0.5);
            color: white;
        }

        .theme-toggle-floating {
            position: absolute;
            top: 2rem;
            right: 2rem;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0,0,0,0.05);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            cursor: pointer;
            z-index: 100;
            transition: all 0.3s ease;
        }

        body.dark-mode .theme-toggle-floating {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .theme-toggle-floating:hover {
            transform: rotate(15deg) scale(1.1);
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .landing-title { font-size: 2.2rem; }
            .landing-content { padding: 3rem 1.5rem; }
            .countdown-container { gap: 0.75rem; }
            .countdown-box { min-width: 70px; padding: 1rem; }
            .countdown-number { font-size: 1.8rem; }
        }
    </style>
</head>
<body class="landing-page-body">

    <button id="theme-toggle-landing" class="theme-toggle-floating" title="Toggle Theme">🌙</button>

    <div class="landing-page">
        <div class="landing-content">
            <h1 class="landing-title">Anak Papih Competition 2026</h1>
            <p class="landing-subtitle">Menyambut Hari Kemerdekaan dengan semangat pantang menyerah. Persiapkan dirimu untuk kompetisi terbesar tahun ini!</p>
            
            <div class="countdown-container">
                <div class="countdown-box">
                    <span id="days" class="countdown-number">00</span>
                    <span class="countdown-label">Hari</span>
                </div>
                <div class="countdown-box">
                    <span id="hours" class="countdown-number">00</span>
                    <span class="countdown-label">Jam</span>
                </div>
                <div class="countdown-box">
                    <span id="minutes" class="countdown-number">00</span>
                    <span class="countdown-label">Menit</span>
                </div>
                <div class="countdown-box">
                    <span id="seconds" class="countdown-number">00</span>
                    <span class="countdown-label">Detik</span>
                </div>
            </div>

            <a href="login.html" class="cta-btn">Mulai Kompetisi &rarr;</a>
        </div>
    </div>

    <script>
        // Countdown Timer Logic (Target: Aug 17, 2026)
        const targetDate = new Date("August 17, 2026 00:00:00").getTime();

        const countdownInterval = setInterval(() => {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance < 0) {
                clearInterval(countdownInterval);
                document.getElementById("days").innerText = "00";
                document.getElementById("hours").innerText = "00";
                document.getElementById("minutes").innerText = "00";
                document.getElementById("seconds").innerText = "00";
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = days < 10 ? "0" + days : days;
            document.getElementById("hours").innerText = hours < 10 ? "0" + hours : hours;
            document.getElementById("minutes").innerText = minutes < 10 ? "0" + minutes : minutes;
            document.getElementById("seconds").innerText = seconds < 10 ? "0" + seconds : seconds;
        }, 1000);

        // Standalone Theme Toggle Logic for Landing Page
        const themeBtn = document.getElementById("theme-toggle-landing");
        if (localStorage.getItem("theme") === "dark") {
            document.body.classList.add("dark-mode");
            themeBtn.textContent = "☀️";
        }

        themeBtn.addEventListener("click", () => {
            document.body.classList.toggle("dark-mode");
            if (document.body.classList.contains("dark-mode")) {
                localStorage.setItem("theme", "dark");
                themeBtn.textContent = "☀️";
            } else {
                localStorage.setItem("theme", "light");
                themeBtn.textContent = "🌙";
            }
        });
    </script>
</body>
</html>
